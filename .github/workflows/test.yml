name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The embedding model is fetched from HuggingFace on first use. Uncached,
      # every run re-downloads it and an unauthenticated 429 turns into a red
      # build that has nothing to do with the change under test.
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-model-${{ hashFiles('package-lock.json') }}
          restore-keys: hf-model-
      - run: npm test
