name: dependency security

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/dependency-advisory-baseline.json
      - .github/DEPENDENCY_SECURITY.md
      - .github/workflows/dependency-security.yml
      - scripts/check-dependency-advisories.mjs
      - tests/dependency-advisories.test.js
      - tests/fixtures/dependency-audits.json
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/dependency-advisory-baseline.json
      - .github/workflows/dependency-security.yml
      - scripts/check-dependency-advisories.mjs
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  audit-baseline:
    name: audited baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compare live production audit with reviewed baseline
        run: node scripts/check-dependency-advisories.mjs
